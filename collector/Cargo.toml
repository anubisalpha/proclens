[package]
name = "collector"
version = "0.1.0-beta.2"
edition = "2021"
license = "MIT"
description = "ProcLens elevated collector: reads memory, disk, file and driver activity and serves it to the UI"

[dependencies]
proclens-proto = { path = "../proto" }
ferrisetw = "1.2.0"
sysinfo = "0.39"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
]
