[package]
name = "proclens-app"
version = "0.1.0-beta.5"
description = "ProcLens: see what your PC is really running"
authors = ["Anubis Productions"]
edition = "2021"
license = "MIT"

[lib]
# The `_lib` suffix avoids a Windows-only name clash with the bin target
# (https://github.com/rust-lang/cargo/issues/8519).
name = "proclens_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Embeds the built front end (../dist) instead of loading the dev server. `tauri build` turns this
# on for you; for a plain `cargo build --release` pass `--features custom-protocol`.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
proclens-proto = { path = "../../proto" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
