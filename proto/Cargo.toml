[package]
name = "proclens-proto"
version = "0.0.1"
edition = "2021"
description = "Wire format, framing and client library shared by the ProcLens collector and UI"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dev-dependencies.windows]
version = "0.62"
features = ["Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_Foundation"]

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_System_Registry", # SHELLEXECUTEINFOW embeds HKEY
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
